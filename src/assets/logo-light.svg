<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>

    <radialGradient id="sphereGrad" cx="38%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#72ddf0"/>
      <stop offset="18%"  stop-color="#30b8d0"/>
      <stop offset="48%"  stop-color="#0e8098"/>
      <stop offset="78%"  stop-color="#065870"/>
      <stop offset="100%" stop-color="#022838"/>
    </radialGradient>

    <radialGradient id="hlGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- i — Punkt (hell, rosa Kern) -->
  <circle cx="246" cy="192" r="70" fill="#e6edf3"/>
  <circle cx="246" cy="192" r="56" fill="#f0a0a2"/>

  <!-- i — Strich -->
  <rect x="197" y="314" width="100" height="518" rx="50" fill="#e6edf3"/>

  <!-- o — Ring (Stroke, Inneres transparent → dunkler Hintergrund scheint durch) -->
  <circle cx="668" cy="527" r="268" fill="none" stroke="#e6edf3" stroke-width="85"/>

  <!-- o — 3D-Sphere -->
  <circle cx="668" cy="527" r="204" fill="url(#sphereGrad)"/>

  <!-- o — Cyan-Rand -->
  <circle cx="668" cy="527" r="204" fill="none" stroke="#00cfe0" stroke-width="14"/>

  <!-- Highlight -->
